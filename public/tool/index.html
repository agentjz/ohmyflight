<!DOCTYPE html>
<html lang="zh-CN" data-default-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>看门狗</title>
    <script src="../theme.js"></script>
    <link rel="stylesheet" href="../theme.css">
    <link rel="stylesheet" href="./index.css">
</head>
<body>
    <div class="page-shell">
        <header class="command-bar">
            <a class="brand-lockup" href="./index.html" aria-label="看门狗首页">
                <span class="brand-copy">
                    <strong>看门狗</strong>
                </span>
            </a>

            <nav class="external-actions" aria-label="扩展入口">
                <div class="cooling-unlock" id="coolingUnlockArea">
                    <label class="visually-hidden" for="coolingUnlockInput">隐藏工具解锁输入</label>
                    <input
                        id="coolingUnlockInput"
                        type="text"
                        autocomplete="off"
                        autocapitalize="off"
                        spellcheck="false"
                        aria-describedby="coolingUnlockStatus"
                    >
                    <span id="coolingUnlockStatus" class="visually-hidden" aria-live="polite"></span>
                </div>
                <a class="header-link" href="../memo/index.html" target="_blank" rel="noopener noreferrer" title="备忘录">备忘录</a>
                <button class="icon-button" id="homeThemeToggle" type="button" aria-label="切换到暗夜模式" aria-pressed="false" title="切换到暗夜模式">
                    <svg class="theme-icon theme-icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <circle cx="12" cy="12" r="4"></circle>
                        <path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path>
                    </svg>
                    <svg class="theme-icon theme-icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M20.99 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 20.99 12.79Z"></path>
                    </svg>
                </button>
                <a class="header-link" id="csn2apiLink" href="https://luckymaomi.github.io/csn2api" target="_blank" rel="noopener noreferrer" title="csn2api" hidden>csn2api</a>
            </nav>
        </header>

        <main>
            <h1 class="visually-hidden">看门狗</h1>

            <section class="tool-controls" aria-labelledby="toolIndexTitle">
                <div class="search-box">
                    <label class="visually-hidden" for="searchInput">搜索工具</label>
                    <div class="search-field">
                        <input id="searchInput" type="search" placeholder="输入工具、任务或关键词" autocomplete="off" spellcheck="false">
                        <kbd aria-hidden="true">/</kbd>
                    </div>
                </div>

                <div class="category-area">
                    <h2 id="toolIndexTitle" class="visually-hidden">工具索引</h2>
                    <span id="resultToolCount" class="visually-hidden" aria-live="polite">0 项</span>
                    <div class="category-switch" id="categorySwitch" data-default-category="all" role="group" aria-label="工具分类">
                        <button type="button" class="category-button" data-category="all" aria-pressed="false">全部 <span data-category-count="all">0</span></button>
                        <button type="button" class="category-button" data-category="heavy" aria-pressed="false">重型 <span data-category-count="heavy">0</span></button>
                        <button type="button" class="category-button" data-category="light" aria-pressed="false">轻型 <span data-category-count="light">0</span></button>
                        <button type="button" class="category-button" data-category="automation" aria-pressed="false">自动化 <span data-category-count="automation">0</span></button>
                    </div>
                </div>
            </section>

            <section id="toolsView" aria-label="工具清单">
                <div class="tool-list" id="toolList"></div>
            </section>

            <div id="emptyState" class="empty-state" hidden>没找到。换个词再搜一次。</div>
        </main>
    </div>

    <script type="module" src="./app.js"></script>
</body>
</html>
