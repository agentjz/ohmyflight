<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>运行资质比对</title>
  <script src="../../../theme.js"></script><link rel="stylesheet" href="../../../libs/bootstrap.min.css"><link rel="stylesheet" href="../../../theme.css">
  <style>
    body { background: transparent; padding: 20px; } .page-shell { width: min(1440px, 100%); margin: 0 auto; }
    .section-card { margin-bottom: 16px; } .upload-grid { display: grid; grid-template-columns: repeat(2,minmax(0,1fr)); gap: 16px; }
    .file-box { border: 1px solid var(--watchdog-border); padding: 14px; background: var(--watchdog-surface); } .file-name { color: var(--watchdog-text-muted); font-size: 13px; margin-top: 8px; word-break: break-all; }
    .status-line { margin-top: 12px; padding: 8px 10px; border: 1px solid var(--watchdog-border); color: var(--watchdog-text-muted); } .status-success { border-color: var(--watchdog-success-border); background: var(--watchdog-success-bg); color: var(--watchdog-success-text); } .status-danger { border-color: var(--watchdog-danger-border); background: var(--watchdog-danger-bg); color: var(--watchdog-danger-text); } .status-info { border-color: var(--watchdog-info-border); background: var(--watchdog-info-bg); color: var(--watchdog-info-text); }
    .summary-grid { display: grid; grid-template-columns: repeat(5,minmax(0,1fr)); gap: 10px; } .summary-item { border: 1px solid var(--watchdog-border); padding: 12px; background: var(--watchdog-surface); } .summary-item span { display:block; color:var(--watchdog-text-muted); font-size:12px; } .summary-item strong { display:block; font-size:24px; margin-top:4px; }
    .table-shell { overflow:auto; max-height:480px; border:1px solid var(--watchdog-border); } table { min-width:960px; margin:0; } th { position:sticky; top:0; background:var(--watchdog-surface-muted)!important; white-space:nowrap; } td,th { padding:8px 10px!important; } .empty-cell { text-align:center; color:var(--watchdog-text-muted); padding:24px!important; }
    .status-tag { display:inline-block; border:1px solid var(--watchdog-border); padding:2px 6px; font-size:12px; } .status-portal { color:var(--watchdog-danger-text); background:var(--watchdog-danger-bg); border-color:var(--watchdog-danger-border); } .status-personnel { color:var(--watchdog-warning-text); background:var(--watchdog-warning-bg); border-color:var(--watchdog-warning-border); } .status-match { color:var(--watchdog-success-text); background:var(--watchdog-success-bg); border-color:var(--watchdog-success-border); }
    @media (max-width: 760px) { body { padding:12px; } .upload-grid,.summary-grid { grid-template-columns:1fr; } }
  </style>
</head>
<body><main class="page-shell">
  <div class="card section-card"><div class="card-body text-center position-relative py-2"><a href="../../../index.html" class="position-absolute start-0 top-50 translate-middle-y ms-3 text-decoration-none">返回</a><h5 class="card-title mb-0">运行资质比对</h5></div></div>
  <div class="card section-card"><div class="card-body"><h6 class="card-title border-bottom pb-2 mb-3">上传文件</h6><div class="upload-grid"><div class="file-box"><label class="form-label" for="personnelFile">人员信息 Excel</label><input id="personnelFile" class="form-control" type="file" accept=".xls,.xlsx"><div id="personnelFileName" class="file-name">尚未选择</div></div><div class="file-box"><label class="form-label" for="portalFile">飞行门户运行资质名册 Excel</label><input id="portalFile" class="form-control" type="file" accept=".xls,.xlsx"><div id="portalFileName" class="file-name">尚未选择</div></div></div><div id="statusLine" class="status-line status-info">请选择两份 Excel 文件。</div><div class="d-flex gap-2 mt-3"><button id="compareButton" class="btn btn-primary" disabled>开始比对</button><button id="exportButton" class="btn btn-outline-primary" disabled>导出 Excel</button></div></div></div>
  <section id="resultSection" class="card section-card" hidden><div class="card-body"><h6 class="card-title border-bottom pb-2 mb-3">总体摘要</h6><div id="summaryGrid" class="summary-grid"></div></div></section>
  <section id="resultSectionDetail" class="card section-card"><div class="card-body"><div class="d-flex align-items-center justify-content-between gap-3 flex-wrap border-bottom pb-2 mb-3"><div><h6 class="card-title mb-1">资质明细</h6><div id="selectedSummary" class="small text-muted"></div></div><div class="d-flex gap-2"><select id="qualificationSelect" class="form-select form-select-sm" style="width:190px"></select><select id="statusFilter" class="form-select form-select-sm" style="width:140px"><option value="diff" selected>只看差异</option><option value="all">全部</option><option value="双方一致">双方一致</option><option value="仅飞行门户">仅飞行门户</option><option value="仅人员信息">仅人员信息</option></select></div></div><div class="small text-muted mb-2">当前显示 <span id="detailCount">0</span> 条</div><div class="table-shell"><table class="table table-hover align-middle"><thead><tr><th>状态</th><th>员工号</th><th>人员信息姓名</th><th>门户姓名</th><th>人员信息角色</th><th>人员信息来源</th><th>门户来源</th><th>提示</th></tr></thead><tbody id="detailBody"></tbody></table></div></div></section>
  <section class="card section-card"><div class="card-body"><h6 class="card-title border-bottom pb-2 mb-3">数据问题（<span id="issueCount">0</span>）</h6><div class="table-shell"><table class="table table-sm"><thead><tr><th>来源</th><th>类型</th><th>说明</th><th>位置</th></tr></thead><tbody id="issueBody"><tr><td colspan="4" class="empty-cell">比对后显示数据问题</td></tr></tbody></table></div></div></section>
</main><script src="../../../libs/xlsx.bundle.js"></script><script type="module" src="./app.js"></script></body></html>
