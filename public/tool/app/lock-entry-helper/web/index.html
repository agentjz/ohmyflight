<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>锁班皇帝</title>
    <script src="./theme.js"></script>
    <link rel="stylesheet" href="./libs/bootstrap.min.css">
    <link rel="stylesheet" href="./theme.css">
    <link rel="stylesheet" href="./styles.css">
</head>
<body>
    <div class="workspace-shell">
        <header class="workspace-header">
            <div>
                <h1>锁班皇帝</h1>
                <p><span id="modeLabel">串行工作台</span> · <span id="statusMessage">等待启动</span></p>
            </div>
            <div class="header-actions">
                <span id="statusBadge" class="status-badge is-idle">空闲</span>
                <button id="themeToggle" type="button" class="btn btn-outline-secondary btn-sm">主题</button>
            </div>
        </header>

        <main class="workspace-grid">
            <section class="work-panel input-panel" aria-labelledby="inputHeading">
                <div class="panel-heading">
                    <h2 id="inputHeading">录入数据</h2>
                </div>

                <div class="mode-switch" role="group" aria-label="输入方式">
                    <input type="radio" class="btn-check" name="inputMode" id="modeExcel" value="excel" checked>
                    <label class="btn btn-outline-secondary" for="modeExcel">Excel</label>
                    <input type="radio" class="btn-check" name="inputMode" id="modePaste" value="paste">
                    <label class="btn btn-outline-secondary" for="modePaste">粘贴</label>
                </div>

                <div id="excelPanel" class="input-content">
                    <label class="form-label" for="excelFile">锁班文件</label>
                    <input id="excelFile" class="form-control" type="file" accept=".xlsx,.xlsm">
                </div>

                <div id="pastePanel" class="input-content" hidden>
                    <label class="form-label" for="pastedText">锁班数据</label>
                    <textarea id="pastedText" class="form-control" rows="7" placeholder="员工号 姓名 锁班类型 YYYY-MM-DD YYYY-MM-DD"></textarea>
                </div>

                <div class="field-grid">
                    <div>
                        <label class="form-label" for="whitelistText">员工号白名单</label>
                        <textarea id="whitelistText" class="form-control" rows="3" placeholder="每行或连续粘贴六位员工号"></textarea>
                    </div>
                    <div>
                        <label class="form-label" for="commonReason">统一备注</label>
                        <textarea id="commonReason" class="form-control" rows="3"></textarea>
                    </div>
                </div>

                <div id="smartOptions" class="option-row" hidden>
                    <label for="conflictRecovery" class="check-option">
                        <input id="conflictRecovery" type="checkbox">
                        <span>启用冲突旧锁班自动解锁并重提一次</span>
                    </label>
                </div>

                <details class="browser-settings">
                    <summary>浏览器设置</summary>
                    <label class="form-label" for="browserPath">浏览器路径</label>
                    <input id="browserPath" class="form-control" type="text" placeholder="留空使用 Playwright 默认浏览器">
                </details>

                <div class="stage-actions" aria-label="锁班阶段控制">
                    <button id="prepareButton" type="button" class="btn btn-primary">进入录入页面</button>
                    <button id="dataCheckButton" type="button" class="btn btn-outline-secondary" disabled>数据健康检查</button>
                    <button id="runButton" type="button" class="btn btn-success" disabled>开始录入</button>
                    <button id="stopButton" type="button" class="btn btn-danger" disabled>终止</button>
                </div>

                <div class="health-check" id="dataCheckResult">
                    <span>数据健康检查</span>
                    <strong>尚未检查</strong>
                </div>
            </section>

            <section class="work-panel status-panel" aria-labelledby="statusHeading">
                <div class="panel-heading">
                    <h2 id="statusHeading">运行状态</h2>
                    <span id="progressText">0 / 0</span>
                </div>

                <div class="progress" role="progressbar" aria-label="录入进度" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
                    <div id="progressBar" class="progress-bar" style="width: 0%"></div>
                </div>

                <dl class="run-summary">
                    <div><dt>总数</dt><dd id="totalCount">0</dd></div>
                    <div><dt>已完成</dt><dd id="completedCount">0</dd></div>
                    <div><dt>成功</dt><dd id="successCount">0</dd></div>
                    <div><dt>失败</dt><dd id="failedCount">0</dd></div>
                </dl>

                <div class="current-record">
                    <span>当前人员</span>
                    <strong id="currentRecord">-</strong>
                </div>

                <div class="download-row">
                    <a id="resultDownload" class="btn btn-outline-secondary disabled" aria-disabled="true">下载结果 Excel</a>
                </div>
            </section>

            <section class="work-panel results-panel" aria-labelledby="resultsHeading">
                <div class="panel-heading">
                    <h2 id="resultsHeading">逐条录入结果</h2>
                    <span id="resultsCount">0 条</span>
                </div>
                <div id="resultsViewport" class="result-viewport">
                    <div id="resultsEmpty" class="results-empty">尚无已返回结果</div>
                    <table id="resultsTable" class="result-table" hidden>
                        <thead></thead>
                        <tbody></tbody>
                    </table>
                </div>
            </section>

            <section class="work-panel log-panel" aria-labelledby="logHeading">
                <div class="panel-heading">
                    <h2 id="logHeading">活动日志</h2>
                </div>
                <ol id="logList" class="log-list" aria-live="polite">
                    <li class="is-muted">尚无运行记录</li>
                </ol>
            </section>
        </main>
    </div>
    <script type="module" src="./app.mjs"></script>
</body>
</html>
