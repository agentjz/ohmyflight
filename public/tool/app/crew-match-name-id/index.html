<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>姓名匹配员工号</title>
    <script src="../../../theme.js"></script>
    <link rel="stylesheet" href="../../../libs/bootstrap.min.css">
    <style>
        body { background: transparent; padding: 20px; }
        .result-heading { display: flex; align-items: center; justify-content: space-between; gap: 16px; }
        .result-toolbar { display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px; }
        .result-toolbar-group { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
        .image-title-control { display: flex; align-items: center; gap: 7px; }
        .image-title-control label { color: var(--omf-text-muted); font-size: 13px; white-space: nowrap; }
        .image-title-input { width: 150px; text-align: center; letter-spacing: 0; }
        .table-container { border: 1px solid var(--omf-border); border-radius: 6px; max-height: 430px; overflow: auto; }
        .result-table { width: 100%; min-width: 900px; table-layout: fixed; border-collapse: separate; border-spacing: 0; margin: 0; }
        .result-table th,
        .result-table td { padding: 10px 12px; border-right: 1px solid var(--omf-border); border-bottom: 1px solid var(--omf-border); font-size: 14px; text-align: center; vertical-align: middle; white-space: normal; overflow-wrap: anywhere; }
        .result-table th { position: sticky; top: 0; z-index: 2; font-weight: 700; }
        .result-table th:last-child,
        .result-table td:last-child { border-right: none; }
        .result-table tbody tr:last-child td { border-bottom: none; }
        .result-table tbody tr.selected td { background: var(--omf-info-bg); }
        .result-table .col-select { width: 48px; }
        .result-table .col-id { width: 112px; }
        .result-table .col-name { width: 144px; }
        .result-table .col-department { width: 126px; }
        .result-table .col-tech-info { width: 220px; }
        .result-table .col-tech-level { width: 110px; }
        .result-table .col-custom { width: 170px; }
        .custom-header-wrap { display: grid; grid-template-columns: minmax(0, 1fr) 28px; align-items: center; gap: 4px; }
        .custom-header-input,
        .custom-value-input { width: 100%; min-width: 0; color: var(--omf-text); background: var(--omf-surface); border: 1px solid transparent; border-radius: 4px; text-align: center; letter-spacing: 0; }
        .custom-header-input { height: 32px; padding: 4px 6px; font-weight: 700; }
        .custom-value-input { min-height: 34px; padding: 6px 8px; }
        .custom-header-input:hover,
        .custom-value-input:hover { border-color: var(--omf-border); }
        .custom-header-input:focus,
        .custom-value-input:focus { border-color: var(--omf-focus); outline: 2px solid color-mix(in srgb, var(--omf-focus) 22%, transparent); }
        .remove-column-btn { width: 28px; height: 28px; padding: 0; border: 0; border-radius: 4px; color: var(--omf-text-muted); background: transparent; font-size: 20px; line-height: 1; }
        .remove-column-btn:hover { color: var(--omf-danger-text); background: var(--omf-danger-bg); }
        .no-result { text-align: center; padding: 40px 20px; color: #6c757d; font-size: 14px; }
        #fileStatus { padding: 8px 12px; border-radius: 6px; font-size: 12px; display: none; }
        @media (max-width: 768px) {
            body { padding: 12px; }
            .result-heading,
            .result-toolbar { align-items: stretch; flex-direction: column; }
            .result-toolbar-group { width: 100%; }
        }
    </style>
    <link rel="stylesheet" href="../../../theme.css">
</head>
<body>
    <div class="container">
        <div class="card mb-4">
            <div class="card-body text-center position-relative">
                <a href="../../../index.html" class="position-absolute start-0 top-50 translate-middle-y ms-3 text-decoration-none">返回首页</a>
                <h4 class="card-title mb-0">姓名匹配员工号</h4>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-body">
                <h5 class="card-title border-bottom pb-2 mb-3">导入员工数据</h5>
                <div class="d-flex align-items-center gap-3">
                    <span id="fileStatus"></span>
                    <label class="btn btn-outline-secondary" style="cursor:pointer;">
                        重新选择文件
                        <input type="file" id="fileInput" accept=".xlsx,.xls" style="display:none;">
                    </label>
                </div>
            </div>
        </div>
        
        <div class="card mb-4">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center gap-3 border-bottom pb-2 mb-3">
                    <h5 class="card-title mb-0">输入文本</h5>
                    <div class="d-flex gap-2">
                        <button id="searchBtn" class="btn btn-outline-secondary" disabled>查询匹配</button>
                        <button id="clearBtn" class="btn btn-outline-secondary">清空输入</button>
                    </div>
                </div>
                <textarea id="textInput" class="form-control" rows="8" placeholder="请在此处粘贴或输入包含员工姓名的文本内容..."></textarea>
            </div>
        </div>
            
        <div class="card mb-4">
            <div class="card-body">
                <div class="result-heading border-bottom pb-2 mb-3">
                    <h5 class="card-title mb-0">匹配结果</h5>
                    <span id="countInfo" class="text-muted small">匹配到 0 个员工</span>
                </div>
                <div class="result-toolbar mb-3">
                    <div class="result-toolbar-group">
                        <button id="copyIdBtn" class="btn btn-outline-secondary">复制员工号列</button>
                        <button id="copyNameBtn" class="btn btn-outline-secondary">复制姓名列</button>
                    </div>
                    <div class="result-toolbar-group">
                        <button id="addColumnBtn" class="btn btn-outline-secondary">新增列</button>
                        <div class="form-check mb-0">
                            <input id="includeTechLevelInput" class="form-check-input" type="checkbox">
                            <label class="form-check-label" for="includeTechLevelInput">导出技术等级</label>
                        </div>
                        <div class="image-title-control">
                            <label for="imageTitleInput">图片标题</label>
                            <input id="imageTitleInput" class="form-control image-title-input" type="text" value="人员名单">
                        </div>
                        <button id="exportExcelBtn" class="btn btn-secondary">导出Excel</button>
                        <button id="exportImageBtn" class="btn btn-secondary">导出图片</button>
                    </div>
                </div>
                <div id="resultArea">
                    <div class="table-container">
                        <table id="resultTable" class="result-table">
                            <thead id="resultHead"></thead>
                            <tbody id="resultBody">
                                <tr><td colspan="6" class="no-result">匹配结果将显示在这里...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>

<script src="../../../libs/xlsx-js-style.min.js"></script>
<script src="../../../libs/html2canvas.min.js"></script>
<script src="logic.js"></script>
<script src="table-editor.js"></script>
<script src="export.js"></script>
<script src="main.js"></script>
</body>
</html>
